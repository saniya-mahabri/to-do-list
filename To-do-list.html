<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Todo List - Kajal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #efbfb0;
    }
    .container {
      max-width: 600px;
      margin-top: 50px;
    }
    .completed {
      text-decoration: line-through;
      color: gray;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center mb-4"> Todo List</h2>

    
    <div class="input-group mb-3">
      <input type="text" id="todoInput" class="form-control" placeholder="Enter a new task" />
      <button class="btn btn-primary" onclick="addTodo()">Add</button>
    </div>


    <div id="message" class="text-danger mb-3"></div>

    
    <ul class="list-group" id="todoList"></ul>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    function saveToLocalStorage() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function showMessage(msg) {
      const messageDiv = document.getElementById('message');
      messageDiv.textContent = msg;
      setTimeout(() => {
        messageDiv.textContent = '';
      }, 2000);
    }

    function renderTodos() {
      const list = document.getElementById('todoList');
      list.innerHTML = '';

      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = 'list-group-item d-flex justify-content-between align-items-center';

        if (todo.editing) {
          li.innerHTML = `
            <input type="text" class="form-control me-2" id="editInput${index}" value="${todo.text}" />
            <div>
              <button class="btn btn-success btn-sm me-1" onclick="saveEdit(${index})">Save</button>
              <button class="btn btn-secondary btn-sm" onclick="cancelEdit(${index})">Cancel</button>
            </div>
          `;
        } else {
          li.innerHTML = `
            <span onclick="toggleComplete(${index})" class="${todo.completed ? 'completed' : ''}" style="cursor:pointer;">
              ${todo.text}
            </span>
            <div>
              <button class="btn btn-warning btn-sm me-1" onclick="editTodo(${index})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteTodo(${index})">Delete</button>
            </div>
          `;
        }

        list.appendChild(li);
      });

      saveToLocalStorage();
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();

      if (text === '') {
        showMessage("Please enter a task!");
        return;
      }

      const duplicate = todos.some(todo => todo.text.toLowerCase() === text.toLowerCase());

      if (duplicate) {
        showMessage("Task already exists!");
        return;
      }

      todos.push({ text, completed: false, editing: false });
      input.value = '';
      renderTodos();
    }

    function editTodo(index) {
      todos[index].editing = true;
      renderTodos();
    }

    function saveEdit(index) {
      const input = document.getElementById(`editInput${index}`);
      const newText = input.value.trim();

      if (newText === '') {
        showMessage("Task cannot be empty!");
        return;
      }

      const duplicate = todos.some((todo, i) => i !== index && todo.text.toLowerCase() === newText.toLowerCase());

      if (duplicate) {
        showMessage("Task already exists!");
        return;
      }

      todos[index].text = newText;
      todos[index].editing = false;
      renderTodos();
    }

    function cancelEdit(index) {
      todos[index].editing = false;
      renderTodos();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      renderTodos();
    }

    function toggleComplete(index) {
      todos[index].completed = !todos[index].completed;
      renderTodos();
    }
    renderTodos();
  </script>
</body>
</html>
